<h3>Flight Search</h3>

<div class="mb-3">
    <label for="from" class="form-label">From</label>
    <input class="form-control" id="from" [formField]="form.from">
    <div class="form-text">Enter the origin of your flight.</div>
</div>

<div class="mb-3">
    <label for="to" class="form-label">To</label>
    <input class="form-control" id="to" [formField]="form.to">
    <div class="form-text">Enter the destination of your flight.</div>
</div>

<p>Your current Route: {{flightRoute()}}</p>

<button class="btn btn-primary" (click)="search()" [disabled]="!criteria().from || !criteria().to">Search</button>

<hr>

<div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
    @for(flight of flights(); track flight.id) {
         <div class="col">
            <app-flight-card [flight]="flight" [selected]="basket()[flight.id]" />
         </div>
    }
</div>
